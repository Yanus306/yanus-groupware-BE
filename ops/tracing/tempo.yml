stream_over_http_enabled: true
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: warn
internal_server:
  http_listen_address: 127.0.0.1
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 127.0.0.1:4318
live_store:
  max_live_traces_bytes: 67108864
  max_block_bytes: 16777216
  max_trace_idle: 10s
  max_block_duration: 5m
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    pool:
      max_workers: 20
      queue_depth: 200
overrides:
  defaults:
    compaction:
      block_retention: 48h
    global:
      max_bytes_per_trace: 1048576
query_frontend:
  mcp_server:
    enabled: false
usage_report:
  reporting_enabled: false
