[server]
http_addr = 127.0.0.1
http_port = 3000
domain = grafana.yanus.bond
root_url = https://grafana.yanus.bond/

[security]
admin_user = yanus
admin_password = $__file{/etc/grafana/yanus-admin-password}
secret_key = $__file{/etc/grafana/yanus-secret-key}
disable_gravatar = true
cookie_secure = true
cookie_samesite = lax

[users]
allow_sign_up = false
default_theme = dark

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/yanus-dashboards/01-overview.json

[plugins]
preinstall_disabled = true
