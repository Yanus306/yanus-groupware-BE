yanus.observability.enabled=true
management.server.port=9091
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.environment=prod
management.metrics.tags.service=backend
management.metrics.tags.application=yanus-groupware
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=30s
server.tomcat.mbeanregistry.enabled=true
logging.level.com.yanus.attendance=INFO
logging.file.name=/var/log/yanus/prod/application.log
logging.logback.rollingpolicy.file-name-pattern=/var/log/yanus/prod/application.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=300MB
logging.logback.rollingpolicy.clean-history-on-start=true
logging.structured.format.file=com.yanus.attendance.global.logging.SafeJsonLogFormatter
logging.structured.format.console=com.yanus.attendance.global.logging.SafeJsonLogFormatter
