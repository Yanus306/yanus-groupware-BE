name: CI

on:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev, main ]

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 백업 사본 검증·실패·잠금·보존 테스트
        run: node --test ops/backup/*.test.mjs
      - name: PostgreSQL16 격리 백업·암호화·실패 복구 검증
        run: node ops/backup/qa/scenarios.mjs
      - name: 백업 실패·지연·지표 누락 알림 규칙 검증
        run: docker run --rm --entrypoint promtool -v "$PWD/ops/backup:/work:ro" -w /work prom/prometheus:v2.45.3 test rules yanus-backup-rules.test.yml

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 외부 점검 상태 및 전달 계약 검증
        run: node --test ops/observability/*.test.mjs
      - name: Prometheus 규칙 검증
        run: docker run --rm --entrypoint promtool -v "$PWD/ops/observability:/work" -w /work prom/prometheus:v2.45.3 test rules yanus-rules.test.yml
      - name: 실제 Alertmanager 격리 라우팅 검증
        run: node ops/observability/verify-alert-routing.mjs

  test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 실행 권한 부여
        run: chmod +x gradlew

      - name: 테스트 실행
        run: ./gradlew test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: 빌드
        run: ./gradlew build -x test tracingJar
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 검증된 Java Agent 준비
        run: |
          mkdir -p .omo/downloads
          curl --fail --silent --show-error --location --max-time 120 https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.32.0/opentelemetry-javaagent.jar -o .omo/downloads/opentelemetry-javaagent.jar
          printf 'f787eb6c7f3d18e69a431e108a15278d25ee37f83d68b678f621e063f3988f82  .omo/downloads/opentelemetry-javaagent.jar\n' | sha256sum -c -
      - name: 실제 HTTP·JDBC 추적과 민감 정보 제거·수집기 실패 격리 검증
        run: |
          docker build -t yanus-tracing-qa:217 -f ops/tracing/qa/Dockerfile .
          node ops/tracing/qa/scenarios.mjs
      - name: 격리 복원 도구 설치
        run: sudo apt-get update && sudo apt-get install -y age
      - name: 실제 백엔드·Flyway fixture 백업부터 읽기 API 복원·실패 정리까지 검증
        run: node ops/backup/qa/restore-fixture.mjs build/libs/attendance-0.0.1-SNAPSHOT.jar
