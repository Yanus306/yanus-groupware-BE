name: 운영 외부 접속 점검
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: yanus-public-probe-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 최근 예약 점검 결과 불러오기
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ops/observability/read-probe-state.mjs
      - name: 공개 접속 상태 확인 및 장애·복구 알림
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node ops/observability/public-probe.mjs
      - name: 점검·알림 실패를 포함한 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-state-${{ github.event_name == 'schedule' && 'prod' || 'manual' }}
          path: probe-state.json
          retention-days: 7
          if-no-files-found: error
