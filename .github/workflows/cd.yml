name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yanus-production-release
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 동일 후보 테스트 및 빌드
        run: ./gradlew test bootJar
        env:
          YANUS_RELEASE_BUILD: 'true'
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      - name: 배포 도구 계약 검증
        run: |
          bash -n ops/deploy/deploy.sh
          node --test ops/deploy/verify-release.test.mjs
      - name: 후보 manifest 생성
        run: |
          mkdir -p build/release
          cp build/libs/attendance-0.0.1-SNAPSHOT.jar build/release/app.jar
          cp -r build/test-results/test build/release/test-results
          node ops/deploy/create-manifest.mjs build/release/app.jar build/release/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: build/release/
          retention-days: 14
          if-no-files-found: error

  deploy:
    needs: candidate
    if: vars.YANUS_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: candidate
      - name: 고정 호스트 키로 동일 후보 전달
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$SERVER_PORT" =~ ^[0-9]+$ && "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ -n "$SERVER_KNOWN_HOSTS" && -n "$SERVER_SSH_KEY" ]]
          mkdir -p ~/.ssh
          trap 'rm -f ~/.ssh/yanus-deploy-key' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/yanus-deploy-key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_options=(-i ~/.ssh/yanus-deploy-key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          destination="$SERVER_USER@$SERVER_HOST"
          ssh "${ssh_options[@]}" -p "$SERVER_PORT" "$destination" "mkdir -p /home/yanus/incoming/$GITHUB_SHA"
          scp "${ssh_options[@]}" -P "$SERVER_PORT" candidate/app.jar candidate/manifest.json "$destination:/home/yanus/incoming/$GITHUB_SHA/"
          ssh "${ssh_options[@]}" -p "$SERVER_PORT" "$destination" "sudo -n /usr/local/lib/yanus-deploy/deploy/deploy.sh /home/yanus/incoming/$GITHUB_SHA"
